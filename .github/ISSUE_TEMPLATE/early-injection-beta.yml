name: Early-injection beta report
description: Report an activation, fallback, installer, or compatibility problem in the opt-in beta.
title: '[early beta] '
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Copy the beta report from Preferences → Slick when possible. Review all text before posting and remove workspace names, member IDs, messages, paths, tokens, cookies, and private URLs.
  - type: textarea
    id: beta-report
    attributes:
      label: Beta report
      description: Paste the redacted “Copy beta report” output here.
      render: text
    validations:
      required: true
  - type: input
    id: slack-version
    attributes:
      label: Slack version
      placeholder: e.g. 4.x.x
    validations:
      required: true
  - type: input
    id: install-command
    attributes:
      label: Exact installation command
      placeholder: bash ./install.sh --beta
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the active plugins and the smallest sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Smallest relevant redacted error
      description: Do not attach a whole profile or unredacted network capture.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and removed secrets and private workspace content.
          required: true
