version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
    groups:
      oxc:
        patterns: [oxfmt, oxlint]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
