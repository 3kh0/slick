name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  issues: write

env:
  # Packaging downloads target Electron archives; no job launches node_modules/electron.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Read build number
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[1-9][0-9]*$ ]]; then
            echo "not understood" >&2
            exit 1
          fi
          build="${GITHUB_REF_NAME#v}"
          if (( build <= 85 )); then
            echo "v2 releases must use build 86 or newer; v85 is already live on v1" >&2
            exit 1
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  electron-compatible:
    needs: validate-tag
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: node scripts/ci/electron-watch.cjs
      - name: Reject an incompatible runtime
        if: steps.check.outputs.mismatch == 'true'
        run: |
          echo "Slack and Slick use different Electron majors; refusing to release." >&2
          exit 1

  build-mac:
    needs: [validate-tag, electron-compatible]
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      SLICK_SIGN_IDENTITY: ${{ secrets.SLICK_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install tools
        run: bun install --frozen-lockfile
      # electron-builder's own CSC_LINK import can't unlock the keychain it
      # creates on these runners, so import the certificate here instead.
      - name: Import signing cert
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Compile icon variants
        run: scripts/icon/render-icon.sh
      - name: Build release artifacts
        run: bun run build -- package --arch "${{ matrix.arch }}"
        env:
          SLICK_BUILD: ${{ needs.validate-tag.outputs.build }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - name: Check signature
        if: env.SLICK_SIGN_IDENTITY != ''
        run: |
          app=$(find dist/release -maxdepth 2 -name Slick.app -print -quit)
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep 'Authority=Developer ID Application'
          spctl --assess --type execute -vv "$app"
          xcrun stapler validate "$app"
      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/release/Slick-*.zip
            dist/release/Slick-*.dmg
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: slick-mac-${{ matrix.arch }}
          path: |
            dist/release/Slick-*.zip
            dist/release/Slick-*.dmg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-win:
    needs: [validate-tag, electron-compatible]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cache Windows dependency downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Build release artifact
        run: bun run build -- package --arch "${{ matrix.arch }}"
        env:
          SLICK_BUILD: ${{ needs.validate-tag.outputs.build }}
      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/release/Slick-*-win32-*.zip
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: slick-win32-${{ matrix.arch }}
          path: dist/release/Slick-*-win32-*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-linux:
    needs: [validate-tag, electron-compatible]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg libx11-dev libxkbfile-dev
      - name: Build release artifacts
        run: bun run build -- package --arch "${{ matrix.arch }}"
        env:
          SLICK_BUILD: ${{ needs.validate-tag.outputs.build }}
      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/release/Slick-*-linux-*.tar.gz
            dist/release/Slick-*.AppImage
            dist/release/slick_*.deb
            dist/release/slick-*.rpm
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: slick-linux-${{ matrix.arch }}
          path: |
            dist/release/Slick-*-linux-*.tar.gz
            dist/release/Slick-*.AppImage
            dist/release/slick_*.deb
            dist/release/slick-*.rpm
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    needs: [validate-tag, build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: slick-*
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: Slick Build ${{ needs.validate-tag.outputs.build }}
          files: |
            dist/Slick-*.zip
            dist/Slick-*.dmg
            dist/Slick-*.tar.gz
            dist/Slick-*.AppImage
            dist/slick_*.deb
            dist/slick-*.rpm
          generate_release_notes: true

  homebrew:
    needs: [validate-tag, release]
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: homebrew-tap-update
      cancel-in-progress: false
    env:
      BUILD: ${{ needs.validate-tag.outputs.build }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check deploy key configuration
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [[ -z "$TAP_KEY" ]]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY is required to update the tap" >&2
            exit 1
          fi
      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: 3kh0/homebrew-tap
          ref: main
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Test cask updater
        run: node --test scripts/ci/update-homebrew.test.cjs
      - name: Download both Mac release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$BUILD" --repo "$GITHUB_REPOSITORY" \
            --pattern "Slick-2.0.$BUILD-mac-arm64.zip" \
            --pattern "Slick-2.0.$BUILD-mac-x64.zip" \
            --dir "$RUNNER_TEMP/homebrew-assets"
      - name: Update the cask version and checksums
        run: node scripts/ci/update-homebrew.cjs "$BUILD" homebrew-tap/Casks/slick.rb "$RUNNER_TEMP/homebrew-assets"
      - name: Validate the cask
        env:
          # --online queries GitHub; unauthenticated calls share the runner IP's 60/hour limit.
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          brew tap 3kh0/tap "file://$GITHUB_WORKSPACE/homebrew-tap"
          # The local clone above must include the uncommitted cask update.
          cp homebrew-tap/Casks/slick.rb "$(brew --repository 3kh0/tap)/Casks/slick.rb"
          brew style --cask 3kh0/tap/slick
          brew audit --cask --strict --online --arch=all 3kh0/tap/slick
      - name: Push the tap update as GitHub Actions
        working-directory: homebrew-tap
        run: |
          git diff --check
          if git diff --quiet -- Casks/slick.rb; then
            echo "No tap update needed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/slick.rb
          git commit -m "Update Slick to 2.0.$BUILD"
          git push origin HEAD:main

  firefox:
    # AMO signing can take several minutes; overlap it with desktop packaging.
    needs: [validate-tag, electron-compatible]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      BUILD: ${{ needs.validate-tag.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build and lint
        run: |
          bun run build -- firefox
          bun run extension:lint
        env:
          SLICK_BUILD: ${{ env.BUILD }}
      - name: Source archive for AMO review
        run: |
          mkdir -p dist/release
          git archive --format=zip -o "dist/release/slick-firefox-2.0.$BUILD-source.zip" HEAD
      - name: Sign on AMO
        run: |
          bunx web-ext sign --channel unlisted \
            --source-dir dist/extension/firefox \
            --artifacts-dir dist/signed \
            --upload-source-code "dist/release/slick-firefox-2.0.$BUILD-source.zip"
          signed=$(find dist/signed -name '*.xpi' -print -quit)
          test -n "$signed"
          mv "$signed" "dist/release/slick-firefox-2.0.$BUILD.xpi"
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      - name: Update manifest
        run: node scripts/firefox-updates.ts "dist/release/slick-firefox-2.0.$BUILD.xpi" "$BUILD" dist/release/updates.json
      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/release/slick-firefox-*.xpi
      - name: Upload signed extension
        uses: actions/upload-artifact@v7
        with:
          name: firefox-signed
          path: |
            dist/release/slick-firefox-*.xpi
            dist/release/slick-firefox-*-source.zip
            dist/release/updates.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  firefox-publish:
    needs: [release, firefox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firefox-signed
          path: dist/release
      - name: Attach to release
        run: gh release upload "$GITHUB_REF_NAME" dist/release/slick-firefox-*.xpi dist/release/slick-firefox-*-source.zip dist/release/updates.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  copr:
    needs: [validate-tag, release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      BUILD: ${{ needs.validate-tag.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl rpm pipx
          pipx install copr-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up rpmbuild tree
        run: mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
      - name: Prepare release sources
        run: |
          version="2.0.$BUILD"
          sed -i "s/^%global slick_version .*/%global slick_version $version/" packaging/copr/slick.spec
          tarball_url="https://github.com/3kh0/slick/releases/download/v${BUILD}/Slick-${version}-linux-x64.tar.gz"
          curl --fail --location --retry 5 --retry-delay 10 --retry-all-errors \
            "$tarball_url" -o "$HOME/rpmbuild/SOURCES/Slick-${version}-linux-x64.tar.gz"
      - name: Copy sources and build SRPM
        run: |
          cp packaging/copr/slick.spec ~/rpmbuild/SPECS/
          cp packaging/copr/slick.desktop ~/rpmbuild/SOURCES/
          cp packaging/flatpak/dev.slick.Slick.metainfo.xml ~/rpmbuild/SOURCES/slick.metainfo.xml
          rpmbuild -bs ~/rpmbuild/SPECS/slick.spec
      - name: Submit to COPR
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr <<EOF
          [copr-cli]
          login = ${{ secrets.COPR_LOGIN }}
          username = echolive
          token = ${{ secrets.COPR_API_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF
          srpm=$(find ~/rpmbuild/SRPMS -name '*.src.rpm' -print -quit)
          copr-cli build echolive/slick "$srpm"

  chromium:
    needs: [validate-tag, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun run build -- chromium
        env:
          SLICK_BUILD: ${{ needs.validate-tag.outputs.build }}
      - name: Attach Chromium store package
        run: gh release upload "$GITHUB_REF_NAME" dist/extension/slick-chromium.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  userscript:
    needs: [validate-tag, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun run userscript:build
        env:
          SLICK_BUILD: ${{ needs.validate-tag.outputs.build }}
      - name: Attach Violentmonkey userscript and update metadata
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/userscript/slick-monaco-*.js --clobber
          gh release upload "$GITHUB_REF_NAME" dist/userscript/*.user.js dist/userscript/*.meta.js --clobber
        env:
          GH_TOKEN: ${{ github.token }}
