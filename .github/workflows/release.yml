name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  issues: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Read build number
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[1-9][0-9]*$ ]]; then
            echo "not understood" >&2
            exit 1
          fi
          build="${GITHUB_REF_NAME#v}"
          if (( build <= 85 )); then
            echo "v2 releases must use build 86 or newer; v85 is already live on v1" >&2
            exit 1
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  electron-compatible:
    needs: validate-tag
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: node scripts/ci/electron-watch.js
      - name: Reject an incompatible runtime
        if: steps.check.outputs.mismatch == 'true'
        run: |
          echo "Slack and Slick use different Electron majors; refusing to release." >&2
          exit 1

  build-mac:
    needs: [validate-tag, electron-compatible]
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install tools
        run: bun install --frozen-lockfile
      - name: Build release artifacts
        run: bun run build -- package --arch "${{ matrix.arch }}"
        env:
          SLICK_BUILD: ${{ needs.validate-tag.outputs.build }}
      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/release/Slick-*.zip
            dist/release/Slick-*.dmg
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: slick-mac-${{ matrix.arch }}
          path: |
            dist/release/Slick-*.zip
            dist/release/Slick-*.dmg
          if-no-files-found: error
          retention-days: 1

  build-win:
    needs: [validate-tag, electron-compatible]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build release artifact
        run: bun run build -- package --arch "${{ matrix.arch }}"
        env:
          SLICK_BUILD: ${{ needs.validate-tag.outputs.build }}
      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/release/Slick-*-win32-*.zip
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: slick-win32-${{ matrix.arch }}
          path: dist/release/Slick-*-win32-*.zip
          if-no-files-found: error
          retention-days: 1

  build-linux:
    needs: [validate-tag, electron-compatible]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build release artifact
        run: bun run build -- package --arch "${{ matrix.arch }}"
        env:
          SLICK_BUILD: ${{ needs.validate-tag.outputs.build }}
      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/release/Slick-*-linux-*.tar.gz
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: slick-linux-${{ matrix.arch }}
          path: dist/release/Slick-*-linux-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [validate-tag, build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: Slick Build ${{ needs.validate-tag.outputs.build }}
          files: |
            dist/Slick-*.zip
            dist/Slick-*.dmg
            dist/Slick-*.tar.gz
          generate_release_notes: true
