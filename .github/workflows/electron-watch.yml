name: Electron watch

on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-watch
  cancel-in-progress: false

jobs:
  check:
    name: Check Slack's Electron version
    runs-on: macos-26
    outputs:
      version_mismatch: ${{ steps.check.outputs.version_mismatch }}
      slack_electron: ${{ steps.check.outputs.slack_electron }}
    steps:
      - uses: actions/checkout@v7
      - name: Test runtime updates
        run: node --test scripts/ci/electron-watch.test.cjs
      - id: check
        run: node scripts/ci/electron-watch.cjs

  update:
    needs: check
    if: needs.check.outputs.version_mismatch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PIN: ${{ needs.check.outputs.slack_electron }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - uses: cachix/install-nix-action@v31
      - name: Update desktop and Flatpak runtimes
        run: node scripts/ci/update-electron.cjs "$PIN"
      - name: Sync and validate Nix pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          bash scripts/ci/sync-nix-pins.sh "${tag#v}"
      - run: bun run check
      - name: Open runtime update PR
        uses: peter-evans/create-pull-request@v8
        with:
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          base: main
          branch: ci/electron
          delete-branch: true
          add-paths: |
            package.json
            bun.lock
            packaging/flatpak/dev.slick.Slick.yml
            packaging/nix/pins.json
          commit-message: 'fix(desktop): match Slack Electron ${{ env.PIN }}'
          title: 'fix(desktop): match Slack Electron ${{ env.PIN }}'
          body: ''
