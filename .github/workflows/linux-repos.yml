# Scaffold only: configure signing secrets and a deployment destination before enabling this job.
name: Linux repository metadata (disabled)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vN)
        required: true
        type: string

permissions:
  contents: read

jobs:
  repository-metadata:
    if: ${{ false }} # Deliberately disabled: do not publish unsigned or unreviewed repositories.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install metadata tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils createrepo-c rpm
      - name: Download release packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[1-9][0-9]*$ ]]
          build="${TAG#v}"
          mkdir -p repo/apt/pool/main repo/rpm
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "slick_2.0.${build}_amd64.deb" -D repo/apt/pool/main
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "slick-2.0.${build}.x86_64.rpm" -D repo/rpm
      - name: Generate unsigned metadata for review
        run: |
          set -euo pipefail
          mkdir -p repo/apt/dists/stable/main/binary-amd64
          cd repo/apt
          dpkg-scanpackages pool/main /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -n -k dists/stable/main/binary-amd64/Packages
          apt-ftparchive release dists/stable > dists/stable/Release
          cd ../rpm
          createrepo_c .
      # Before enabling: import a protected GPG key from secrets, sign apt
      # Release as InRelease + Release.gpg, sign RPMs before createrepo_c,
      # sign repodata/repomd.xml, and upload atomically to Pages or R2.
      # Required secrets: LINUX_REPO_GPG_PRIVATE_KEY, LINUX_REPO_GPG_PASSPHRASE,
      # and deployment credentials (e.g. R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY).
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-linux-repository-preview
          path: repo/
