name: CI

on:
  # push is main only. Every other branch is covered by pull_request, and
  # listing one here too (v2-rewrite did) runs the whole matrix twice on an
  # open PR.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CI ran only the four static checks and no tests at all, so a broken
        # test could be merged without anything noticing. typecheck and the
        # test suites are the point of this job, not an extra.
        check:
          - 'fmt:check'
          - lint
          - 'lint:sh'
          - typecheck
          - 'test:app'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        # Electron's postinstall downloads a ~100MB binary that no check needs.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun run ${{ matrix.check }}

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # versions.ts reads the newest v<N> tag for the build number.
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Bundling is the check that a plugin actually compiles and default-exports
      # a named class; typecheck alone does not catch that.
      - run: bun run build

  package:
    name: package (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-26
            arch: x64
          - os: windows-latest
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build -- package --arch ${{ matrix.arch }}
        env:
          SLICK_BUILD: '86'
