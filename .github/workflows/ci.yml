name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - 'fmt:check'
          - lint
          - 'lint:sh'
          - typecheck
          - 'test:app'
          - 'test:extension'
          - 'test:userscript'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun run ${{ matrix.check }}

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun run build

  extension:
    name: browser extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun run build -- firefox chromium userscript
      - run: bun run extension:lint
      - run: bun run extension:validate
      - uses: actions/upload-artifact@v7
        with:
          name: slick-browser-extensions
          path: |
            dist/extension/slick-firefox.xpi
            dist/extension/slick-chromium.zip
            dist/userscript/slick.user.js
            dist/userscript/slick.meta.js

  package:
    name: package (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-26
            arch: x64
          - os: windows-latest
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build -- package --arch ${{ matrix.arch }}
        env:
          SLICK_BUILD: '86'
